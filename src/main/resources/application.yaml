spring:
  application:
    name: highpass_backend

  datasource:
    url: jdbc:mariadb://localhost:3310/highpassdb
    username: root
    password: 1234
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # create / update / none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080